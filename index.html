<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atajo · Teórico DGT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22262c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atajo">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: compañero de estudio, directo y tranquilo; frases cortas
   IDEA: la señalización vial española como sistema de interfaz (asfalto, azul de indicación, rojo de peligro, amarillo de obra)
   PICTURE: un hito kilométrico real sobre asfalto marca el progreso; cada pregunta lleva su señal o escena
   COLOUR and TYPE: asfalto #22262c, azul señal #1957c2, rojo señal #d61f2c, amarillo vial #f7c600; Barlow Semi Condensed + Barlow
   LAYOUT: app móvil de una columna, barra inferior con iconos-señal, preguntas a pantalla completa con panel inferior */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f5,#111317);--card:light-dark(#ffffff,#1a1e24);--card2:light-dark(#f5f7fa,#20252c);--ink:light-dark(#14171c,#eef1f5);--mut:light-dark(#5a6372,#9aa4b2);--line:light-dark(#dde2e9,#2b313a);
--asf:#22262c;--asf2:#2e333b;--blue:#1957c2;--blue2:light-dark(#e7eefb,#16233b);--red:#d61f2c;--ok:light-dark(#0f7a3d,#3ccf7c);--yel:#f7c600;
--fd:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;--r1:18px;--r2:12px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4,.disp{font-family:var(--fd);letter-spacing:.1px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:var(--asf);color:#fff;padding:calc(10px + var(--safe-t)) 0 10px}
.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.top h1{font-size:24px;margin:0;font-weight:800;flex:1;line-height:1}
.chipS{display:flex;align-items:center;gap:6px;background:var(--asf2);border-radius:999px;padding:6px 12px 6px 8px;font-weight:600;font-size:14px}
.chipS svg{width:20px;height:20px}
main{padding:16px 0 calc(96px + var(--safe-b))}
/* barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:light-dark(rgba(255,255,255,.94),rgba(22,25,30,.94));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--safe-b))}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--mut);min-height:52px}
.tab svg{width:30px;height:30px;transition:transform .15s}
.tab[aria-current=true]{color:var(--ink);background:var(--blue2)}
.tab[aria-current=true] svg{transform:scale(1.08)}
/* hero: asfalto + hito */
.hero{background:var(--asf);color:#fff;border-radius:var(--r1);overflow:hidden;position:relative}
.hero-in{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 18px 8px}
.hito{width:78px;flex:none}
.hero h2{margin:0;font-size:34px;line-height:1;font-weight:800}
.hero p{margin:6px 0 0;color:#c9d0da;font-size:15px}
.lane{height:54px;position:relative;margin-top:6px}
.lane svg{position:absolute;inset:0;width:100%;height:100%}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:16px 18px;border-radius:var(--r1);background:var(--blue);color:#fff;box-shadow:0 6px 18px -8px rgba(25,87,194,.7);min-height:64px}
.cta b{font-family:var(--fd);font-size:22px;font-weight:700;display:block;line-height:1.1}
.cta span{font-size:14px;opacity:.85}
.cta svg{width:30px;height:30px;flex:none}
.cta:active{transform:scale(.99)}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.today>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.today b{display:block;font-family:var(--fd);font-size:26px;line-height:1.05}
.today span{font-size:13px;color:var(--mut)}
.sec{margin-top:24px}
.sec>h3{font-size:20px;margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:16px}
/* semáforo de preparación */
.ready{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tl{width:36px;background:#1d2026;border:2px solid #3a404a;border-radius:12px;padding:6px;display:grid;gap:5px}
.tl i{display:block;width:24px;height:24px;border-radius:50%;background:#3a3f47}
.tl i.r.on{background:#ff3b3b;box-shadow:0 0 10px #ff3b3b}.tl i.a.on{background:#ffb300;box-shadow:0 0 10px #ffb300}.tl i.g.on{background:#2fd06f;box-shadow:0 0 10px #2fd06f}
.ready h4{margin:0;font-size:19px}.ready p{margin:2px 0 0;font-size:14.5px;color:var(--mut)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.dot.ok{background:var(--ok)}.dot.ko{background:var(--red)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
/* lista de temas */
.topics{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.trow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 14px;min-height:64px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow:active{background:var(--card2)}
.ticon{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--card2);display:grid;place-items:center}
.ticon svg{width:58px;height:auto}
.tname{font-weight:600;line-height:1.25}
.tbar{height:5px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--blue);border-radius:5px}
.tpct{font-family:var(--fd);font-weight:700;font-size:17px;color:var(--mut)}
.trow.reform .tname::after{content:"nuevo";margin-left:8px;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;vertical-align:2px}
.linkrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r1);font-weight:600;margin-top:10px;min-height:56px}
/* capa de juego */
#play{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
#play[hidden]{display:none}
.phead{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + var(--safe-t)) 0 8px}
.phead .wrap{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.x svg{width:18px;height:18px}
.prog{height:10px;background:var(--line);border-radius:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--yel);border-radius:10px;transition:width .35s}
.pcount{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.timer.low{color:var(--red)}
.qbody{padding:6px 0 calc(170px + var(--safe-b))}
.qtag{display:inline-block;font-size:13px;font-weight:700;color:var(--blue);background:var(--blue2);border-radius:8px;padding:3px 9px}
:root[data-theme=dark] .qtag{color:#9fc0ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .qtag{color:#9fc0ff}}
.qtag.new{color:#fff;background:var(--red)}
.qtag.again{background:transparent;color:var(--mut)}
.qimg{margin:12px 0 0;border-radius:var(--r1);overflow:hidden;background:#fff;border:1px solid var(--line);aspect-ratio:240/150}
.qimg svg{display:block;width:100%;height:100%}
.qtext{font-family:var(--fd);font-size:clamp(22px,6vw,26px);line-height:1.2;font-weight:700;margin:16px 0 14px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r2);padding:12px 14px;min-height:60px;font-size:17px;line-height:1.3;transition:border-color .15s,background .15s}
.opt i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--card2);font-family:var(--fd);font-size:18px}
.opt:not(:disabled):active{border-color:var(--blue)}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}.opt.good i{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}.opt.bad i{background:var(--red);color:#fff}
.opt.sel{border-color:var(--blue)}
.opt:disabled{cursor:default}
/* panel inferior de respuesta */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.fb.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.fb .card{max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -10px rgba(0,0,0,.35);padding:18px 18px calc(16px + var(--safe-b));border-top:6px solid var(--st,var(--ok))}
.fb.bad .card{--st:var(--red)}
.fb h4{margin:0;font-size:22px;color:var(--st,var(--ok))}
.fb.bad h4{color:var(--red)}
.fb p{margin:6px 0 0;font-size:15.5px}
.hook{margin-top:10px;background:light-dark(#fff8d6,#2b2612);border-left:5px solid var(--yel);border-radius:8px;padding:8px 12px;font-weight:600;font-size:15px}
.go{display:block;width:100%;margin-top:14px;min-height:54px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:18px;font-family:var(--fd);}
.fb.bad .go{background:var(--asf)}
:root[data-theme=dark] .fb.bad .go{background:#3a4049}
/* resultados */
.res{text-align:center;padding:26px 16px}
.res .rbig{font-family:var(--fd);font-size:64px;line-height:1;font-weight:800}
.res .rbig.ok{color:var(--ok)}.res .rbig.ko{color:var(--red)}
.res p{color:var(--mut);margin:8px 0 0}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:14px;margin-top:12px}
.rcard .qimg{margin-top:8px}
.rcard h5{font-size:17px;margin:10px 0 6px;font-family:var(--fd);}
.rw{color:var(--red);font-size:15px;margin:2px 0}.rr{color:var(--ok);font-weight:700;font-size:15px;margin:2px 0}
.rx{font-size:14.5px;color:var(--mut);margin:6px 0 0}
.rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.primary{min-height:52px;padding:0 22px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-family:var(--fd);font-size:18px}
/* examen intro */
.exhero{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.exhero svg{width:96px;height:auto}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rules div{background:var(--card2);border-radius:var(--r2);padding:10px;text-align:center}
.rules b{display:block;font-family:var(--fd);font-size:28px;line-height:1}
.rules span{font-size:12.5px;color:var(--mut)}
/* fallos y formularios */
label{font-weight:600;font-size:14px}
input,textarea{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);margin:4px 0 12px}
.frow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .ticon{width:44px;height:44px}.frow .ticon svg{width:100%;height:auto}
.frow small{color:var(--mut)}
.empty{text-align:center;padding:24px 10px;color:var(--mut)}
.empty svg{width:80px;margin-bottom:6px}
.note{font-size:13px;color:var(--mut);margin:24px 0 0;line-height:1.45}
/* hoja inferior genérica */
#sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#sheet .card{width:100%;max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safe-b))}
#sheet h3{margin:0 0 6px;font-size:24px}#sheet h4{margin:16px 0 4px;font-size:18px}#sheet p{margin:0;font-size:15.5px}
/* chuleta: botones heredados */
.big{min-height:48px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}
.ghost{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--blue);color:var(--blue);font-weight:700;background:transparent}
:root[data-theme=dark] .ghost{color:#9fc0ff;border-color:#9fc0ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .ghost{color:#9fc0ff;border-color:#9fc0ff}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:16px;margin-bottom:16px}
.bl{animation:bl 1s steps(1) infinite}.bl2{animation:bl 1s steps(1) infinite .5s}@keyframes bl{50%{opacity:.12}}
.cheat-top{border-top:6px solid var(--blue)}
.ck{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,24px);margin-bottom:16px;border-top:8px solid var(--acc)}
.ck h3{margin:0 0 12px;font-size:21px}.ck h4{margin:18px 0 8px;font-size:16px}
.c-speed{--acc:#c8102e}.c-light{--acc:#1e88e5}.c-itv{--acc:#2e7d32}.c-alc{--acc:#f59e0b}.c-pts{--acc:#7b1fa2}.c-dist{--acc:#00897b}.c-perm{--acc:#0050b5}.c-mult{--acc:#546e7a}
.sg{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;border:7px solid #c8102e;color:#111;font-size:19px;font-weight:800;line-height:1;flex:none}
.sg3{font-size:15px;letter-spacing:-.5px}
.sg-b{background:#0050b5;border:3px solid #fff;box-shadow:0 0 0 2px #0050b5;color:#fff}
.spd{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:center}
.spd>div{display:flex;justify-content:center}.spd>.spd-v{justify-content:flex-start;font-size:14.5px;line-height:1.3;display:block}
.spd-h{font-size:13px;font-weight:700;color:var(--mut);text-align:center}
.spd>div:nth-child(3n+4),.spd>div:nth-child(3n+5),.spd>div:nth-child(3n+6){border-top:1px dashed var(--line);padding-top:8px}
.no{font-size:13px;color:var(--mut);font-weight:700}
.mnemo{margin:14px 0 4px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,var(--card));border-left:5px solid var(--acc);font-size:15px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:12px}
.minis>div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.lbl{font-size:13.5px;line-height:1.3}
.pill{background:color-mix(in srgb,var(--acc) 16%,var(--card));border-radius:999px;padding:4px 10px;font-weight:800;font-size:13.5px;text-align:right}
.city{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cv{display:grid;justify-items:center;gap:6px;text-align:center;font-size:13.5px;padding:10px;border-radius:12px;background:light-dark(#f3f5f8,#222a33)}
.street{width:100%;height:30px;border-radius:6px;background:#4b5158;position:relative}
.street::after{content:"";position:absolute;inset:13px 8px auto;height:3px;background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 18px)}
.s1{background:#d9c7a8}.s1::after{display:none}.s3::before{content:"";position:absolute;inset:6px 8px auto;height:2px;background:#fff;box-shadow:0 16px 0 #fff}.s4{background:#3b4046}
.lights{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:light-dark(#0f1a2e,#0b1220);color:#e8eef8}
.lt svg{width:64px;flex:none;background:#000a;border-radius:8px;padding:4px}.lt p{margin:4px 0 0;font-size:14px;line-height:1.4}.lt b{color:#fff}
.lt .v{color:#ffd54f}
.itv{margin-bottom:12px}.itv-n{font-weight:700;font-size:14.5px;margin-bottom:4px}
.itv-bar,.legend{display:flex;gap:2px}.itv-bar{height:30px;border-radius:8px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.seg i{font-style:normal;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.ex{background:#9e9e9e}.bi{background:#43a047}.an{background:#f59e0b}.se{background:#d81e2c}
.itv-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:6px}
.itv-x{font-size:13px;margin-top:3px}.legend{flex-wrap:wrap;gap:6px;margin:6px 0}.legend .seg{padding:3px 8px;border-radius:6px}
.alc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.al{border-radius:14px;padding:12px;display:grid;justify-items:center;text-align:center;color:#111}
.al b{font-size:32px;line-height:1.05}.al small{font-size:12.5px;margin-bottom:4px}.al .lbl{font-weight:700;margin-bottom:4px}
.al.g{background:#ffe082}.al.n{background:#ffb74d}.al.z{background:#ef9a9a}
.ladder{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.st{border-radius:12px;padding:8px 12px;display:grid;justify-items:center;color:#fff;min-width:56px}.st b{font-size:28px;line-height:1}.st span{font-size:11.5px}
.s8{background:#ba68c8}.s12{background:#8e24aa}.s14{background:#6a1b9a}.s15{background:#4a148c}.ar{font-size:12px;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pg{border-radius:14px;padding:12px 12px 12px 64px;position:relative;min-height:70px}
.pg ul{margin:0;padding-left:16px;font-size:14px;line-height:1.45}.pn{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.p6{background:color-mix(in srgb,#d81e2c 12%,var(--card))}.p6 .pn{background:#d81e2c}
.p4{background:color-mix(in srgb,#f57c00 12%,var(--card))}.p4 .pn{background:#f57c00}
.p3{background:color-mix(in srgb,#fbc02d 16%,var(--card))}.p3 .pn{background:#f9a825}
.pv{background:color-mix(in srgb,#7b1fa2 12%,var(--card))}.pv .pn{background:#7b1fa2;font-size:15px}
.dist,.ages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ds,.ages>div{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--acc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);display:grid;gap:2px}
.ds b,.ages b{font-size:24px;line-height:1.1;color:var(--acc)}.ds span,.ages span{font-size:13.5px;line-height:1.3}
:root[data-theme=dark] .ds b,:root[data-theme=dark] .ages b{filter:brightness(1.6)}
.permB .pb{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:14px;align-items:center}
.pbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.pbg>div{display:grid;border-left:4px solid var(--acc);padding-left:8px}.pbg b{font-size:20px}.pbg span{font-size:13px}
@media(max-width:600px){.permB .pb{grid-template-columns:1fr}.permB svg{max-width:200px}.sg{width:46px;height:46px;font-size:17px;border-width:6px}.spd>.spd-v{font-size:13.5px}}
#ch.hide .v:not(.shown){color:transparent!important;background:repeating-linear-gradient(45deg,var(--line) 0 6px,color-mix(in srgb,var(--line) 50%,transparent) 6px 12px)!important;border-radius:6px;cursor:pointer;-webkit-text-fill-color:transparent;filter:none}
#ch.hide .sg .v:not(.shown){display:inline-block;min-width:28px}
#ch.hide .seg .v:not(.shown){background:#0003!important}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

const B2=[
// ===== Velocidad =====
["Velocidad","¿Velocidad máxima de un ciclomotor?",["45 km/h","50 km/h","25 km/h"],0,"Un ciclomotor no puede superar 45 km/h en ninguna vía.","Ciclomotor = 45."],
["Velocidad","En una carretera convencional sin señal, ¿a qué velocidad mínima debes circular como regla general?",["30 km/h","A la mitad de la velocidad genérica de la vía","No hay mínimo"],1,"Fuera de autopistas y autovías, el mínimo es la mitad de la genérica: en convencional, 45 km/h (salvo causa justificada).","Mínimo = la mitad."],
["Velocidad","Una señal redonda con borde rojo y el número 70 indica...",["Velocidad recomendada de 70","Velocidad máxima de 70","Velocidad mínima de 70"],1,"Círculo con borde rojo = máximo obligatorio.",""],
["Velocidad","Una señal redonda de fondo azul con el número 30 indica...",["Velocidad mínima obligatoria de 30","Velocidad máxima de 30","Zona 30"],0,"Círculo azul con número = velocidad mínima.","Azul obliga: obliga a ir al menos a esa."],
["Velocidad","Una señal rectangular azul con el número 60 indica...",["Velocidad máxima de 60","Velocidad aconsejada de 60","Velocidad mínima de 60"],1,"Los rectángulos azules informan: es una velocidad aconsejada, no obligatoria.",""],
["Velocidad","En una zona residencial (señal azul con casa, niños y coche), ¿velocidad máxima?",["20 km/h","30 km/h","10 km/h"],0,"En zona residencial el máximo es 20 km/h y los peatones tienen prioridad; los niños pueden jugar en la calle.",""],
["Velocidad","Un panel de mensaje variable indica 80 y una señal fija de la misma vía indica 100. ¿Qué cumples?",["100, la señal fija manda","80, el panel variable","La media: 90"],1,"La señalización circunstancial (paneles variables) prevalece sobre la fija.",""],
["Velocidad","Superar el límite en más de 80 km/h en una vía interurbana es...",["Infracción grave","Infracción muy grave sin más","Delito"],2,"Más de 80 km/h por encima en interurbana, o más de 60 en urbana, es delito.","60 en ciudad, 80 en carretera: a partir de ahí, juzgado."],
["Velocidad","Superar el límite en más de 60 km/h en una vía urbana es...",["Delito","Infracción leve","Infracción grave"],0,"En vía urbana el umbral del delito es superar el límite en más de 60 km/h.",""],
["Velocidad","Un radar de tramo mide...",["La velocidad media entre dos puntos","La velocidad en un solo punto","Solo la velocidad de camiones"],0,"Calcula tu media por el tiempo que tardas en recorrer el tramo.",""],
["Velocidad","Por la noche, la velocidad adecuada es la que te permite...",["Ir al límite de la vía","Detenerte dentro de la zona iluminada por tus luces","Ver las señales a tiempo"],1,"Si no puedes parar dentro del alcance de tus luces, vas demasiado rápido.",""],
["Velocidad","¿Un conductor novel tiene limitada su velocidad máxima a 80 km/h?",["Sí, durante el primer año","No, ya no existe esa limitación","Solo en autopista"],1,"La limitación específica de velocidad para noveles se eliminó. Circulan con los mismos límites que el resto.","Trampa: era así antes."],
["Velocidad","A 90 km/h, con un tiempo de reacción de 1 segundo, ¿cuántos metros recorres antes de empezar a frenar?",["Unos 10 metros","Unos 25 metros","Unos 50 metros"],1,"90 km/h son 25 metros por segundo. Ese es el recorrido de reacción.","Divide km/h entre 3,6 y tienes metros por segundo."],
["Velocidad","La distancia de detención es la suma de...",["Distancia de reacción y distancia de frenado","Distancia de frenado y distancia de seguridad","Velocidad y peso"],0,"Detención = lo que recorres mientras reaccionas + lo que recorres frenando.",""],
["Velocidad","Al aumentar la velocidad, el campo visual del conductor...",["Aumenta","Se estrecha (efecto túnel)","No cambia"],1,"A más velocidad ves bien solo lo que tienes delante y pierdes lo que pasa a los lados.",""],
["Velocidad","Cuando la calzada está mojada, la distancia de frenado...",["Aumenta","Disminuye","Es igual"],0,"Con agua el neumático agarra menos: necesitas más metros. Duplica la distancia de seguridad.",""],

["Alcohol y drogas","Das positivo en aire. ¿Puedes pedir un análisis de sangre de contraste?",["No","Sí, es un derecho","Solo si eres profesional"],1,"Tienes derecho a un análisis de contraste (sangre, por ejemplo) en un centro sanitario.",""],
["Alcohol y drogas","Conductor general con 0,35 mg/l en aire. ¿Sanción?",["500 € y 4 puntos","1.000 € y 6 puntos","200 € sin puntos"],0,"Entre 0,25 y 0,50 mg/l: 500 € y 4 puntos.","0,25–0,50 = 500 € / 4 pts."],
["Alcohol y drogas","Conductor general con 0,55 mg/l en aire. ¿Sanción administrativa?",["500 € y 4 puntos","1.000 € y 6 puntos","Solo multa"],1,"Más de 0,50 mg/l: 1.000 € y 6 puntos. Por encima de 0,60 ya es delito.",""],
["Alcohol y drogas","Conductor novel con 0,20 mg/l en aire. ¿Qué ocurre?",["Nada, está por debajo de 0,25","Es infracción: su límite es 0,15","Es delito"],1,"El límite del novel es 0,15 mg/l en aire. Supera el suyo aunque estaría bien para un conductor general.",""],
["Alcohol y drogas","¿Los ciclistas están obligados a someterse a las pruebas de alcohol?",["No, no son vehículos a motor","Sí, como cualquier conductor","Solo en ciudad"],1,"Los ciclistas son conductores y tienen las mismas tasas y obligaciones.",""],
["Alcohol y drogas","Tras beber, ¿cuándo suele alcanzarse la tasa máxima de alcohol en sangre?",["Entre 30 y 90 minutos después","Inmediatamente","A las 6 horas"],0,"El alcohol tarda en absorberse: la tasa sigue subiendo un rato después de dejar de beber.","Esperar 10 minutos no sirve: puede estar subiendo."],
["Alcohol y drogas","Un efecto del alcohol en la conducción es...",["Mejor visión nocturna","Falsa sensación de seguridad y más tiempo de reacción","Mayor concentración"],1,"El alcohol hace que te sientas capaz mientras reaccionas peor y calculas peor las distancias.",""],
["Alcohol y drogas","Mezclar alcohol con algunos medicamentos...",["Anula el efecto del alcohol","Puede potenciar los efectos de ambos","No tiene ningún efecto"],1,"Muchos fármacos (ansiolíticos, antihistamínicos...) multiplican el efecto del alcohol.",""],
["Alcohol y drogas","¿Qué efecto suele producir la cocaína en el conductor?",["Somnolencia inmediata","Exceso de confianza y conducción agresiva","Mejora de los reflejos sin riesgos"],1,"Produce euforia y sensación de control, y luego un bajón de cansancio intenso.",""],
["Alcohol y drogas","¿Qué efecto suele producir el cannabis al volante?",["Mejora la concentración","Altera la percepción del tiempo y la distancia y enlentece los reflejos","Ninguno si es poca cantidad"],1,"Dificulta calcular distancias y reaccionar a tiempo.",""],
["Alcohol y drogas","Los conductores profesionales (camión, autobús, taxi...) tienen una tasa de alcohol en aire de...",["0,25 mg/l","0,15 mg/l","0,50 mg/l"],1,"Profesionales y noveles comparten tasa: 0,15 mg/l en aire, 0,3 g/l en sangre.",""],
["Alcohol y drogas","Conducir bajo la influencia de drogas o alcohol de forma que se altera claramente la conducción es...",["Delito, sea cual sea la tasa","Solo infracción","Legal si no superas 0,25"],0,"Si el alcohol o las drogas afectan de forma clara a tu conducción, es delito aunque no se supere 0,60.",""],
// ===== Puntos y permisos =====
["Puntos y permisos","Llevas 3 años sin sanciones con 12 puntos. ¿Qué ocurre?",["Pasas a 14 puntos","Pasas a 15 puntos","Nada"],0,"3 años sin sanciones: +2 (14). Otros 3 años más: +1 (15).","12 → 14 → 15, cada tres años."],
["Puntos y permisos","Si pierdes puntos pero no cometes infracciones durante 2 años (y no eran muy graves), ¿qué pasa?",["Recuperas los 12 puntos","Recuperas 2 puntos","Nada, solo con curso"],0,"2 años sin infracciones devuelven el saldo inicial de 12. Si alguna fue muy grave, son 3 años.",""],
["Puntos y permisos","Un curso de recuperación parcial de puntos permite recuperar como máximo...",["2 puntos","4 puntos","12 puntos"],1,"Hasta 4 puntos (desde la orden de 2024), y como mucho una vez cada 2 años (cada año para profesionales).","Trampa: antes eran 6, muchos tests antiguos lo tienen mal."],
["Puntos y permisos","Pierdes todos los puntos. ¿Cuánto tiempo mínimo estarás sin poder obtener de nuevo el permiso?",["1 mes","6 meses","5 años"],1,"6 meses (3 para profesionales), con curso de reeducación y examen. Si reincides en 3 años, 12 meses.",""],
["Puntos y permisos","Conducir con el permiso perdido por pérdida total de puntos es...",["Infracción leve","Delito","Infracción grave"],1,"Conducir sin permiso por pérdida de puntos, o sin haberlo obtenido nunca, es delito.",""],
["Puntos y permisos","Conducir con el permiso caducado (vencido) es...",["Delito","Infracción administrativa","Legal hasta 6 meses"],1,"Es una infracción con multa, no delito. Pero hay que renovarlo antes de conducir.",""],
["Puntos y permisos","¿Cada cuánto se renueva el permiso B antes de los 65 años?",["Cada 10 años","Cada 5 años","Nunca"],0,"10 años hasta los 65; a partir de entonces, cada 5.","B: 10 años, luego 5."],
["Puntos y permisos","¿A qué edad puedes obtener el permiso AM (ciclomotores)?",["14 años","15 años","16 años"],1,"AM desde los 15. A1 desde los 16. B y A2 desde los 18.","AM 15, A1 16, B 18."],
["Puntos y permisos","¿A qué edad puedes obtener el permiso B?",["17 años","18 años","21 años"],1,"18 años.",""],
["Puntos y permisos","Con el permiso B y 3 años de antigüedad, en España puedes conducir...",["Motocicletas de hasta 125 cc","Cualquier moto","Camiones ligeros"],0,"Con 3 años de B se pueden conducir en España motos de hasta 125 cc (las del A1).",""],
["Puntos y permisos","Saltarte un semáforo en rojo supone perder...",["2 puntos","4 puntos","6 puntos"],1,"Semáforo en rojo, STOP o ceda el paso no respetados: 4 puntos.","Rojo, STOP, ceda: 4."],
["Puntos y permisos","No respetar una señal de STOP supone perder...",["4 puntos","6 puntos","Ninguno"],0,"4 puntos y 200 €.",""],
["Puntos y permisos","Circular en sentido contrario al establecido supone perder...",["3 puntos","4 puntos","6 puntos"],2,"Circular en sentido contrario: 6 puntos.",""],
["Puntos y permisos","Tirar una colilla encendida por la ventanilla supone...",["Solo una multa leve","6 puntos y 200 €","2 puntos"],1,"Arrojar objetos que puedan causar incendios o accidentes: 6 puntos y 200 €.",""],
["Puntos y permisos","Adelantar a un ciclista sin dejar la separación mínima de 1,5 metros supone...",["2 puntos","6 puntos","Ninguna sanción"],1,"Adelantar a ciclistas poniéndolos en peligro o sin la distancia lateral: 6 puntos.",""],
["Puntos y permisos","No mantener la distancia de seguridad con el vehículo de delante supone perder...",["4 puntos","Ninguno","1 punto"],0,"Distancia de seguridad insuficiente: 4 puntos.",""],
["Puntos y permisos","Conducción temeraria. ¿Puntos?",["4","6","2"],1,"6 puntos como infracción. Si se pone en concreto peligro la vida de otros, es delito.",""],
["Puntos y permisos","Las infracciones graves tienen una multa general de...",["100 €","200 €","500 €"],1,"Leves: hasta 100 €. Graves: 200 €. Muy graves: 500 €.","100 / 200 / 500."],
["Puntos y permisos","Las infracciones muy graves tienen una multa general de...",["500 €","200 €","1.000 €"],0,"500 € como regla general (algunas, como alcohol doble, llegan a 1.000 €).",""],
["Puntos y permisos","Si pagas una multa en plazo de pronto pago, ¿qué descuento tienes?",["20 %","50 %","No hay descuento"],1,"50 % de descuento si pagas en los 20 días naturales siguientes a la notificación.","Pronto pago: 50 % en 20 días."],
["Puntos y permisos","¿En cuánto tiempo prescriben las infracciones leves?",["3 meses","6 meses","1 año"],0,"Leves: 3 meses. Graves y muy graves: 6 meses.",""],
["Puntos y permisos","¿Puedes mostrar tu permiso de conducir desde la app miDGT en un control en España?",["Sí, es válido en España","No, solo vale el físico","Solo si eres novel"],0,"El permiso digital de la app miDGT es válido para circular por España.",""],
["Puntos y permisos","Con el permiso B, ¿puedes llevar un remolque de más de 750 kg?",["Nunca","Sí, si el conjunto coche más remolque no supera 3.500 kg","Sí, sin límite"],1,"Con B, remolque pesado solo si la MMA del conjunto no pasa de 3.500 kg. Por encima, B96 o BE.",""],
["Puntos y permisos","¿Qué es un conductor novel a efectos de alcohol y puntos?",["El que tiene menos de 2 años de antigüedad de permiso","El que tiene menos de 1 año","El menor de 25 años"],0,"Novel: menos de 2 años con el permiso. La L, solo el primer año.",""],
["Puntos y permisos","No llevar la placa L durante el primer año es...",["Infracción","Legal si eres mayor de 25","Delito"],0,"Es obligatoria y no llevarla se sanciona.",""],
// ===== Señales y prioridad =====
["Señales y prioridad","¿Qué significan las señales verticales con fondo amarillo?",["Que son temporales (obras)","Que son de peligro en autopista","Que son informativas turísticas"],0,"El fondo amarillo indica señalización de obras, temporal. Prevalece sobre la permanente.",""],
["Señales y prioridad","Una línea amarilla pintada en la calzada indica...",["Señalización temporal, por ejemplo por obras","Carril bus","Nada especial"],0,"Las marcas amarillas en calzada son temporales y prevalecen sobre las blancas.","Amarillo manda sobre blanco."],
["Señales y prioridad","Una línea amarilla continua en el bordillo significa...",["Prohibido parar y estacionar","Prohibido solo estacionar","Carga y descarga"],0,"Amarilla continua: ni parar ni estacionar.",""],
["Señales y prioridad","Una línea amarilla discontinua en el bordillo significa...",["Prohibido parar","Prohibido estacionar (puedes parar)","Estacionamiento libre"],1,"Discontinua: puedes parar, no estacionar.","Continua = nada; discontinua = parar sí."],
["Señales y prioridad","Una cuadrícula amarilla pintada en un cruce te indica que...",["No entres si vas a quedarte detenido dentro","Puedes estacionar","Es zona de bus"],0,"No debes entrar en la cuadrícula si el tráfico te obligaría a quedarte dentro bloqueando el cruce.",""],
["Señales y prioridad","Una línea transversal continua en un cruce indica...",["Lugar de detención obligatoria (STOP)","Ceda el paso","Paso de peatones"],0,"Línea continua transversal = detención. La de ceda el paso es discontinua.",""],
["Señales y prioridad","Unos triángulos blancos pintados en la calzada, con el vértice hacia ti, indican...",["Ceda el paso","Badén","Prohibido adelantar"],0,"Es la marca de ceda el paso en el suelo.",""],
["Señales y prioridad","Una línea continua al lado de una discontinua: ¿qué marca debes obedecer?",["La más próxima a tu lado","Siempre la continua","Siempre la discontinua"],0,"Respetas la que está en tu lado del carril.",""],
["Señales y prioridad","¿Se puede pisar una línea continua?",["Sí, si no viene nadie","No, ni pisar ni atravesar","Solo para adelantar"],1,"La línea continua no se puede pisar ni cruzar (salvo excepciones muy concretas indicadas).",""],
["Señales y prioridad","Dos luces rojas que se encienden alternativamente (paso a nivel, puente móvil) significan...",["Precaución","Prohibido pasar","Paso libre"],1,"Rojas alternativas: prohibido el paso.",""],
["Señales y prioridad","Semáforo de carril con un aspa roja encima de tu carril. ¿Qué indica?",["Carril cerrado: no puedes circular por él","Carril de pago","Carril para adelantar"],0,"Aspa roja = carril prohibido. Flecha verde hacia abajo = carril abierto.",""],
["Señales y prioridad","Un agente con el brazo extendido horizontalmente obliga a detenerse a...",["Los que circulan en la dirección que corta su brazo","Solo a los que tiene detrás","A nadie"],0,"Brazo horizontal: paran quienes se aproximan por los lados que corta el brazo (de frente y por detrás de él).",""],
["Señales y prioridad","Un agente balancea una luz roja o amarilla. ¿Qué significa?",["Detenerse para quienes reciben la señal","Acelerar","Cambio de carril"],0,"Balanceo de luz: obliga a detenerse a los vehículos hacia los que se dirige.",""],
["Señales y prioridad","Una señal con un rombo amarillo de borde blanco indica...",["Calzada con prioridad","Fin de prioridad","Peligro"],0,"Rombo amarillo: estás en vía con prioridad. Tachado: fin de la prioridad.",""],
["Señales y prioridad","Señal rectangular azul con una flecha blanca grande hacia arriba y una roja pequeña hacia abajo:",["Tienes prioridad sobre los que vienen de frente","Debes ceder a los que vienen de frente","Doble sentido"],0,"Es «prioridad respecto al sentido contrario». La redonda con borde rojo indica lo opuesto.",""],
["Señales y prioridad","Señal redonda con borde rojo, flecha roja hacia arriba y negra hacia abajo:",["Prioridad del sentido contrario: debes ceder","Tienes prioridad","Sentido único"],0,"En el estrechamiento debes ceder el paso a los que vienen de frente.",""],
["Señales y prioridad","Una señal de prohibición con una línea diagonal negra o gris encima indica...",["Fin de la prohibición","Prohibición reforzada","Peligro doble"],0,"La diagonal indica el fin de la restricción.",""],
["Señales y prioridad","La Cruz de San Andrés (aspa roja y blanca) indica...",["Paso a nivel sin barreras","Cruce peligroso","Fin de autopista"],0,"Se coloca justo en un paso a nivel sin barreras.",""],
["Señales y prioridad","Pasas la señal blanca con el nombre de una localidad. ¿Qué cambia?",["Empiezan a aplicarse las normas de vía urbana","Nada","Solo cambia el límite a 40"],0,"Es la entrada a poblado: normas urbanas (límites 20/30/50, prohibición de largas en vías iluminadas...).",""],
["Señales y prioridad","Una señal triangular con la silueta de una locomotora indica...",["Paso a nivel sin barreras","Paso a nivel con barreras","Estación de tren"],0,"Locomotora = sin barreras. Una valla dibujada = con barreras.",""],

["Señales y prioridad","Sales de un garaje a la calle. ¿Qué haces?",["Ceder el paso a vehículos y peatones","Salir rápido, tengo prioridad","Tocar el claxon y salir"],0,"Al salir de una propiedad privada se cede el paso a todos (también a los peatones de la acera).",""],
["Señales y prioridad","En un cruce sin señales, una vía está asfaltada y la otra es de tierra. ¿Quién tiene prioridad?",["El que viene por la de tierra si es por la derecha","El que circula por la vía pavimentada","El más grande"],1,"La vía pavimentada tiene prioridad sobre la no pavimentada, aunque el otro venga por la derecha.",""],
["Señales y prioridad","En un cruce sin señales llega un tranvía por tu izquierda. ¿Quién pasa?",["Yo, porque vengo por su derecha","El tranvía","Quien llegue antes"],1,"Los vehículos que circulan sobre raíles tienen prioridad en los cruces sin señalizar.",""],

function startSess(topic){let pool=cards();
if(topic=="__fails")pool=fails();else if(topic)pool=pool.filter(c=>c.t==topic);
const now=Date.now(),d=shuffle(pool.filter(c=>st(c.id).b>0&&st(c.id).d<=now)).sort((a,b)=>st(a.id).b-st(b.id).b),n=shuffle(pool.filter(c=>st(c.id).b==0));
let q=topic=="__fails"?shuffle(pool.slice()).slice(0,10):d.slice(0,10);if(q.length<10)q=q.concat(n.slice(0,10-q.length));
if(q.length<10){const rest=shuffle(pool.filter(c=>!q.includes(c))).sort((a,b)=>st(a.id).d-st(b.id).d);q=q.concat(rest.slice(0,10-q.length))}
if(!q.length)return;
sess={q:q.map(c=>({c,miss:false})),i:0,ok:0,tot:q.length,topic};openPlay();showCard()}
function showCard(){fb.classList.remove("show","bad");const it=sess.q[sess.i];if(!it)return endSess();const c=it.c;
const tag=`<span class="qtag ${NEW.has(c.t)?"new":""}">${esc(c.t)}</span>${it.miss?' <span class="qtag again">otra vez</span>':""}`;
if(c.flash){play.innerHTML=head(sess.i,sess.q.length,`${sess.i+1}/${sess.q.length}`)+`<div class="wrap qbody">${tag}<p class="qtext">${esc(c.q)}</p><p class="mut">Piensa la respuesta antes de darle la vuelta.</p><button class="go" id="rev">Ver respuesta</button></div>`;
$("#px").onclick=()=>go("home");$("#rev").onclick=()=>{feedback(null,c,`<h4 style="color:var(--blue)">${esc(c.ans)}</h4>${c.w?`<p>${esc(c.w)}</p>`:""}<div class="row" style="margin-top:14px;flex-wrap:nowrap"><button class="go" id="no" style="margin:0;background:var(--asf)">No la sabía</button><button class="go" id="si" style="margin:0">La sabía</button></div>`);$("#si").onclick=()=>grade(true);$("#no").onclick=()=>grade(false)};return}
const ord=shuffle([0,1,2]);
play.innerHTML=head(sess.i,sess.q.length,`${sess.i+1}/${sess.q.length}`)+`<div class="wrap qbody">${tag}${qimg(c)}<p class="qtext">${esc(c.q)}</p><div class="opts" id="opts">${ord.map((o,k)=>`<button class="opt" data-o="${o}"><i>${"ABC"[k]}</i><span>${esc(c.o[o])}</span></button>`).join("")}</div></div>`;
play.scrollTop=0;$("#px").onclick=()=>go("home");
$("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.dataset.o)};
document.onkeydown=e=>{const k="abc".indexOf(e.key.toLowerCase());if(k>=0&&!$("#opts .opt:disabled"))answer(+$("#opts").children[k].dataset.o)}}
function feedback(ok,c,html){$("#fbc").innerHTML=html;fb.classList.toggle("bad",ok===false);fb.classList.add("show")}
function answer(o){const it=sess.q[sess.i],c=it.c,right=o==c.a;if(!it.miss)track(c.t,right);
$("#opts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v==c.a)b.classList.add("good");else if(v==o)b.classList.add("bad")});
if(!right)vib(60);
feedback(right,c,`<h4>${right?"Correcto":"No es esa"}</h4>${right?"":`<p><b>Correcta:</b> ${esc(c.o[c.a])}</p>`}<p>${esc(c.w)}</p>${c.h?`<div class="hook">${esc(c.h)}</div>`:""}<button class="go" id="nx">Continuar</button>`);
$("#nx").onclick=()=>grade(right);setTimeout(()=>{try{$("#nx").focus({preventScroll:true})}catch(e){}},50);document.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();grade(right)}}}
function grade(right){document.onkeydown=null;const it=sess.q[sess.i],s=st(it.c.id);
if(right){if(!it.miss){s.b=Math.min(5,s.b+1);sess.ok++}else s.b=Math.max(2,s.b);s.d=Date.now()+IV[s.b]*DAY}
else{s.b=1;s.d=Date.now();if(!it.miss)sess.q.splice(Math.min(sess.i+4,sess.q.length),0,{c:it.c,miss:true})}
S.c[it.c.id]=s;save();sess.i++;showCard()}
function endSess(){bumpStreak();save();const m=mastered(),n=cards().length,t=sess.topic;fb.classList.remove("show","bad");
play.innerHTML=head(1,1,"")+`<div class="wrap"><div class="res"><p style="margin:0">Aciertos a la primera</p><div class="rbig">${sess.ok}/${sess.tot}</div><p>Llevas el ${Math.round(m/n*100)} % dominado · racha de ${S.streak} ${S.streak==1?"día":"días"}</p><p>${due()?`Te quedan ${due()} preguntas para repasar hoy.`:"Por hoy está hecho. Mañana la app sabrá qué preguntarte."}</p><div class="rowb"><button class="primary" id="again">Otras 10</button><button class="btn2" id="home">Volver al inicio</button></div></div></div>`;
$("#px").onclick=()=>go("home");$("#again").onclick=()=>startSess(t);$("#home").onclick=()=>go("home")}

function startExam(){const q=shuffle(BK.map((x,i)=>i)).slice(0,30);exam={q,ord:q.map(()=>shuffle([0,1,2])),i:0,ans:[],end:Date.now()+30*60e3,done:false};openPlay();timerId=setInterval(tick,1000);showQ()}
function tick(){if(!exam||exam.done)return;const t=Math.max(0,exam.end-Date.now()),el=$("#pc");if(el){el.textContent=`${Math.floor(t/60e3)}:${String(Math.floor(t/1e3)%60).padStart(2,"0")}`;el.classList.toggle("low",t<5*60e3);el.classList.add("timer")}if(!t)finishExam()}
function showQ(){if(exam.i>=30)return finishExam();const c=BK[exam.q[exam.i]];
play.innerHTML=head(exam.i,30,"")+`<div class="wrap qbody"><span class="qtag">Pregunta ${exam.i+1} de 30</span>${qimg(c)}<p class="qtext">${esc(c.q)}</p><div class="opts" id="opts">${exam.ord[exam.i].map((o,k)=>`<button class="opt" data-o="${o}"><i>${"ABC"[k]}</i><span>${esc(c.o[o])}</span></button>`).join("")}</div></div>`;
play.scrollTop=0;tick();$("#px").onclick=()=>{if(exam.i==0||confirmExit())go("exam")};
const pick=(o,b)=>{if(exam.lock)return;exam.lock=true;if(b)b.classList.add("sel");setTimeout(()=>{exam.lock=false;exam.ans.push(o);exam.i++;showQ()},180)};
$("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.o,b)};
document.onkeydown=e=>{const k="abc".indexOf(e.key.toLowerCase());if(k>=0)pick(exam.ord[exam.i][k],$("#opts").children[k])}}
function confirmExit(){return true}
function finishExam(){if(exam.done)return;exam.done=true;clearInterval(timerId);document.onkeydown=null;const wrong=[];
exam.q.forEach((qi,k)=>{const c=BK[qi],ok=exam.ans[k]==c.a;if(k<exam.ans.length)track(c.t,ok);if(!ok){wrong.push({c,a:exam.ans[k]});S.c[c.id]={b:1,d:Date.now()}}});
S.ex.push({d:Date.now(),f:wrong.length});S.ex=S.ex.slice(-30);bumpStreak();save();const ok=wrong.length<=3;
play.innerHTML=head(1,1,"")+`<div class="wrap" style="padding-bottom:calc(40px + var(--safe-b))"><div class="res"><div class="rbig ${ok?"ok":"ko"}">${ok?"Apto":"No apto"}</div><p>${wrong.length} ${wrong.length==1?"fallo":"fallos"} de 30. Se aprueba con 3 como máximo.</p><div class="rowb"><button class="primary" id="hm">Volver</button>${wrong.length?`<button class="btn2" id="fx">Corregir estos fallos</button>`:""}</div></div>
${wrong.map(w=>{const c=w.c;return`<div class="rcard"><span class="qtag ${NEW.has(c.t)?"new":""}">${esc(c.t)}</span>${qimg(c)}<h5>${esc(c.q)}</h5>${w.a!=null?`<p class="rw">Tu respuesta: ${esc(c.o[w.a])}</p>`:'<p class="rw">Sin responder</p>'}<p class="rr">Correcta: ${esc(c.o[c.a])}</p><p class="rx">${esc(c.w)}</p></div>`}).join("")}</div>`;
play.scrollTop=0;$("#px").onclick=()=>go("exam");$("#hm").onclick=()=>go("exam");const f=$("#fx");if(f)f.onclick=()=>startSess("__fails")}

try{if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js")}catch(e){}
go("home");

}
</script>
</body>
</html>
