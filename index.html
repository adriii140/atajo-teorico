<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atajo · Teórico DGT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atajo">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calma y claridad de una app nativa de Apple; frases cortas
   IDEA: Fitness + Ajustes de iOS aplicado al estudio del carné
   PICTURE: anillos de progreso tipo Fitness; señales oficiales e ilustraciones 3D en cada pregunta
   COLOUR and TYPE: colores de sistema iOS; tipografía del sistema (SF) con Inter de reserva
   LAYOUT: títulos grandes, listas agrupadas con inserción, barra de pestañas translúcida, preguntas en modal */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--cell:light-dark(#fff,#1c1c1e);--cell2:light-dark(#f2f2f7,#2c2c2e);--fill:light-dark(rgba(120,120,128,.12),rgba(120,120,128,.24));
--label:light-dark(#000,#fff);--label2:light-dark(rgba(60,60,67,.6),rgba(235,235,245,.6));--label3:light-dark(rgba(60,60,67,.3),rgba(235,235,245,.3));
--sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.55));
--blue:light-dark(#007aff,#0a84ff);--green:light-dark(#34c759,#30d158);--red:light-dark(#ff3b30,#ff453a);--orange:light-dark(#ff9500,#ff9f0a);--yellow:light-dark(#ffcc00,#ffd60a);--indigo:light-dark(#5856d6,#5e5ce6);--teal:light-dark(#30b0c7,#40c8e0);
--bar:light-dark(rgba(249,249,249,.86),rgba(22,22,24,.82));
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;letter-spacing:-.2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
img{display:block}
.page{max-width:620px;margin:0 auto;padding:calc(8px + var(--safe-t)) 0 calc(100px + var(--safe-b))}
/* barra compacta al hacer scroll */
.navc{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding:calc(10px + var(--safe-t)) 16px 10px;text-align:center;font-weight:600;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s}
.navc.on{opacity:1}
.lt{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 20px 6px}
.lt h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0}
.lt .date{font-size:13px;font-weight:600;color:var(--label2);text-transform:none;margin-bottom:-2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cell);border-radius:999px;padding:6px 11px;font-size:15px;font-weight:600;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chip img{width:18px;height:18px}
/* grupos */
.gh{font-size:22px;font-weight:700;letter-spacing:.35px;margin:28px 20px 8px}
.gf{font-size:13px;color:var(--label2);margin:8px 32px 0;line-height:1.35}
.group{background:var(--cell);border-radius:12px;margin:0 16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.cell.ic{--inset:60px}
.cell:active{background:var(--fill)}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t small{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.cell .v{color:var(--label2);font-size:17px;font-variant-numeric:tabular-nums}
.chev{width:8px;height:14px;flex:none;color:var(--label3)}
.ico{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;overflow:hidden}
.ico img{width:26px;height:26px;object-fit:contain}
.ico.sign{background:#fff;box-shadow:inset 0 0 0 .5px var(--sep)}.ico.sign img{width:28px;height:28px}
.minibar{height:4px;border-radius:4px;background:var(--fill);margin-top:6px;overflow:hidden}.minibar i{display:block;height:100%;border-radius:4px;background:var(--green)}
/* resumen tipo Fitness */
.sum{margin:0 16px;background:var(--cell);border-radius:16px;padding:16px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.rings{width:132px;height:132px}
.rings circle{fill:none;stroke-linecap:round}
.sum .k{font-size:13px;font-weight:600;color:var(--label2);margin:0}
.sum .n{font-size:28px;font-weight:700;letter-spacing:.3px;line-height:1.1;margin:0 0 8px;font-variant-numeric:tabular-nums}
.sum .n small{font-size:17px;font-weight:600;color:var(--label2)}
.sum .n.g{color:var(--green)}.sum .n.c{color:var(--teal)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px}
.btn:active{opacity:.85}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn.tint{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pad{margin:12px 16px 0}
.ready{display:flex;align-items:center;gap:12px}
.dotS{width:12px;height:12px;border-radius:50%;flex:none}
.tl{display:grid;gap:3px;background:#1c1c1e;border-radius:9px;padding:4px;flex:none}.tl i{width:12px;height:12px;border-radius:50%;display:block}
.hist{display:flex;gap:6px;padding:12px 16px 14px;flex-wrap:wrap}
.hist span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff}
/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(4px + var(--safe-b))}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500;color:light-dark(#8e8e93,#8e8e93);padding:2px 0 4px;min-height:46px}
.tab svg{width:27px;height:27px}
.tab[aria-current=true]{color:var(--blue)}
.tab .badge{position:relative}.tab .badge i{position:absolute;top:-3px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}
/* modal de preguntas */
#play{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .32s cubic-bezier(.2,.9,.25,1)}
#play[hidden]{display:none}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.mh{position:sticky;top:0;z-index:2;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(10px + var(--safe-t)) 16px 10px;display:grid;grid-template-columns:72px 1fr 72px;gap:12px;align-items:center;border-bottom:.5px solid var(--sep)}
.mh .close{color:var(--blue);font-size:17px;text-align:left;min-height:44px}
.mh .cnt{text-align:right;color:var(--label2);font-size:15px;font-variant-numeric:tabular-nums;font-weight:500}
.mh .cnt.low{color:var(--red)}
.track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.qwrap{max-width:620px;margin:0 auto;padding:16px 16px calc(220px + var(--safe-b))}
.qmeta{font-size:13px;font-weight:600;color:var(--label2);display:flex;gap:8px;align-items:center}
.qmeta .new{color:#fff;background:var(--red);border-radius:6px;padding:1px 7px;font-size:12px}
.qmeta .again{color:var(--orange)}
.media{margin-top:10px;border-radius:16px;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center;background:var(--cell)}
.media.sign{background:#fff;box-shadow:inset 0 0 0 .5px var(--sep)}
.media.sign img{width:auto;height:72%;max-width:80%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.media.emo{background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--tint,#007aff) 22%,var(--cell)),color-mix(in srgb,var(--tint,#007aff) 8%,var(--cell)))}
.media.emo img{width:46%;max-width:180px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
.qtext{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;margin:16px 4px 14px;text-wrap:pretty}
.opts{background:var(--cell);border-radius:14px;overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:58px;position:relative;font-size:17px;line-height:1.3}
.opt+.opt::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.opt .rad{width:26px;height:26px;border-radius:50%;flex:none;border:1.5px solid var(--label3);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label2)}
.opt:not(:disabled):active{background:var(--fill)}
.opt.good .rad{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad .rad{background:var(--red);border-color:var(--red);color:#fff}
.opt.good{background:color-mix(in srgb,var(--green) 10%,var(--cell))}
.opt.bad{background:color-mix(in srgb,var(--red) 9%,var(--cell))}
.opt.sel .rad{background:var(--blue);border-color:var(--blue);color:#fff}
.opt:disabled{cursor:default;color:var(--label)}
.opt:disabled:not(.good):not(.bad){color:var(--label2)}
.media.photo{background:#000}.media.photo img{width:100%;height:100%;object-fit:cover}.media{position:relative}.cred{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico.ph img{width:100%;height:100%;object-fit:cover}
.tsub{display:block;font-size:12px;color:var(--l2,#8e8e93);margin-top:3px;font-weight:400}
.itvbar.tl2{display:block;width:100%;gap:0;height:auto;overflow:visible;border-radius:0;margin-top:8px}
.tl2 .trk{position:relative;width:auto;height:26px;margin-right:10px}
.tl2 .trk span{position:absolute;top:0;bottom:0;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.tl2 .tks i{position:absolute;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:2px solid var(--cell,#1c1c1e);box-sizing:border-box;width:10px;height:10px;margin-left:-5px;z-index:1}
.tl2 .trk span+i,.tl2 .trk i{pointer-events:none}
.tl2 .arr{position:absolute;right:-10px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:8px solid var(--l3,#8e8e93);border-right:0}
.tl2 .tks{position:relative;height:20px;margin:8px 10px 0 0;border-top:1px solid var(--sep,rgba(128,128,128,.35))}
.tl2 .tks em{position:absolute;top:6px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--l2,#8e8e93);white-space:nowrap}
.tl2 .tks em:first-child{transform:none}
.tl2 .tks em::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:5px;background:var(--l2,#8e8e93)}
.tl2 .tks em:first-child::before{left:0}
#cheat.hide .tl2:not(.shown) .trk span,#cheat.hide .tl2:not(.shown) .tks{filter:blur(7px) saturate(.2);opacity:.6}
.ptsh{display:flex;align-items:center;gap:10px;margin:22px 20px 8px}
.ptsh .ptag{min-width:30px;height:30px;font-size:14px;border-radius:8px;padding:0 6px}
.ptsh b{font-size:17px;font-weight:600}
.ptrow{align-items:center;gap:12px}
.ptrow .dot{width:8px;height:8px;border-radius:50%;flex:none}
/* hoja de respuesta */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.9,.25,1),visibility 0s .34s}
.sheet.show{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.9,.25,1)}
.sheet .in{max-width:620px;margin:0 auto;background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:10px 20px calc(16px + var(--safe-b))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 12px}
.res-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.35px}
.res-h svg{width:28px;height:28px;flex:none}
.sheet p{margin:8px 0 0;font-size:16px;line-height:1.4;color:var(--label)}
.sheet .corr{color:var(--label2);font-size:15px}
.tip{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:var(--fill);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500}
.tip img{width:22px;height:22px;flex:none}
.sheet .btn{margin-top:14px}
/* resultados */
.result{text-align:center;padding:28px 16px 8px}
.result .ring{width:160px;height:160px;margin:0 auto}
.result h2{font-size:28px;margin:14px 0 4px;letter-spacing:.35px}
.result p{color:var(--label2);margin:0;font-size:16px}
.rq{background:var(--cell);border-radius:14px;margin:12px 16px 0;padding:14px}
.rq .media{aspect-ratio:16/8}
.rq h5{font-size:17px;font-weight:600;margin:10px 0 6px;line-height:1.3}
.rq .w{color:var(--red);font-size:15px;margin:2px 0}.rq .r{color:var(--green);font-size:15px;font-weight:600;margin:2px 0}.rq .x{color:var(--label2);font-size:14px;margin:6px 0 0}
/* formularios */
.field{display:block;width:100%;padding:13px 16px;font:inherit;font-size:17px;border:0;background:transparent;color:var(--label)}
.field::placeholder{color:var(--label3)}
.fsep{height:.5px;background:var(--sep);margin-left:16px}
textarea.field{resize:vertical;min-height:72px}
/* interruptor iOS */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw input:checked+span{background:var(--green)}.sw input:checked+span::after{transform:translateX(20px)}
/* hoja genérica */
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#modal[hidden]{display:none}
#modal .in{width:100%;max-width:620px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 0 calc(24px + var(--safe-b));animation:up .3s cubic-bezier(.2,.9,.25,1)}
#modal .mt{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:6px 16px 10px}
#modal .mt b{text-align:center;font-weight:600}
#modal .mt button{color:var(--blue);text-align:right;font-weight:600;min-height:44px}
.prose{padding:0 20px}.prose h4{font-size:17px;margin:18px 0 4px}.prose p{margin:0;color:var(--label2);font-size:16px;line-height:1.45}
.foot{font-size:12px;color:var(--label2);margin:28px 32px 0;line-height:1.45}
.foot a{color:var(--blue);text-decoration:none}
/* chuleta */
.cs{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;align-items:center;gap:6px 8px;padding:10px 16px;position:relative}
.cs+.cs::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cs.head{padding:10px 16px 4px;font-size:12px;font-weight:600;color:var(--label2);text-align:center}
.cs.head span:first-child{text-align:left}
.cs .who{font-size:15px;line-height:1.3}
.cs .who small{display:block;color:var(--label2);font-size:13px}
.cs .sv{display:grid;place-items:center}
.cs .sv img{width:44px;height:44px}
.cs .sv .no{font-size:12px;color:var(--label2);font-weight:600}
.kv{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;min-height:48px}
.kv+.kv::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.kv.ic+.kv.ic::before{left:60px}
.kv .k{flex:1;font-size:15.5px;line-height:1.3}
.kv .k small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
.kv .val{font-weight:600;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv img.si{width:34px;height:34px;flex:none}
.memo{margin:10px 16px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--yellow) 20%,var(--cell));font-size:15px;line-height:1.4}
.ptag{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:9px;color:#fff;font-weight:700;font-size:16px;flex:none}
.itvbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;margin-top:6px}
.itvbar span{display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.ex{background:#8e8e93}.bi{background:#34c759}.an{background:#ff9500}.se{background:#ff3b30}
#cheat.hide .val:not(.shown),#cheat.hide .cs .sv:not(.shown) img,#cheat.hide .itvbar:not(.shown) span{filter:blur(9px) saturate(.2);opacity:.6;cursor:pointer}
#cheat.hide .itvbar:not(.shown){cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="navc" id="navc"></div>
<div class="page" id="view"></div>
<nav class="tabbar" aria-label="Secciones"><div class="in" id="nav">
<button class="tab" data-v="home"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5C4 5.7 4.7 5 5.5 5H11c1.7 0 3 1.3 3 3v15c0-1.1-.9-2-2-2H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M24 6.5c0-.8-.7-1.5-1.5-1.5H17c-1.7 0-3 1.3-3 3v15c0-1.1.9-2 2-2h6.5c.8 0 1.5-.7 1.5-1.5z"/></svg>Estudiar</button>
<button class="tab" data-v="exam"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="15.5" r="9"/><path d="M14 10.5v5l3 2M11 3h6M14 3v3.5"/></svg>Examen</button>
<button class="tab" data-v="cheat"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="3.5" width="17" height="21" rx="3"/><path d="M10 9h8M10 13.5h8M10 18h5"/></svg>Chuleta</button>
<button class="tab" data-v="mine"><span class="badge" id="badge"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12.3 4.9 3.6 20.4c-.8 1.4.2 3.1 1.8 3.1h17.2c1.6 0 2.6-1.7 1.8-3.1L15.7 4.9c-.8-1.4-2.6-1.4-3.4 0z"/><path d="M14 10.5v5.5M14 19.6v.2"/></svg></span>Fallos</button>

function howModal(){modal("Cómo funciona",`<div class="prose"><h4>Recordar, no releer</h4><p>Cada pregunta te obliga a sacar la respuesta de memoria antes de verla. Ese esfuerzo es lo que la fija.</p><h4>Repasar justo antes de olvidar</h4><p>Cada acierto aleja la pregunta: mañana, en 3 días, en una semana, en dos. Cada fallo la trae de vuelta enseguida.</p><h4>Poco y a diario</h4><p>El anillo azul es tu objetivo del día: 10 preguntas. El verde es tu progreso: sube con cada acierto. Una pregunta está dominada cuando la aciertas 4 veces en días distintos.</p><h4>El plan</h4><p>Sesión diaria hasta el 80 % de dominio. Después, un simulacro al día. Con tres aptos seguidos, a pedir fecha.</p><h4>Trampas típicas</h4><p>Desconfía de «siempre» y «nunca», lee hasta el final por si hay un «no» escondido y, si dudas, elige la opción que más protege a peatones y ciclistas.</p></div>`)}
function installModal(){modal("Instalar",`<div class="prose"><h4>En iPhone (Safari)</h4><p>Pulsa el botón Compartir y elige «Añadir a pantalla de inicio». Se abrirá a pantalla completa, como una app.</p><h4>En Android (Chrome)</h4><p>Menú de los tres puntos y «Añadir a pantalla de inicio» o «Instalar aplicación».</p><h4>Por qué conviene</h4><p>Instalada, funciona sin conexión y el móvil conserva mejor tu progreso. Safari puede borrar los datos de una web que no se abre en una semana; instalada, no.</p></div>`)}
function creditsModal(){const fs=[...new Set(Object.values(IMG.SFILE))];modal("Fuentes y créditos",`<div class="prose"><h4>Señales de tráfico</h4><p>Imágenes oficiales del catálogo español alojadas en Wikimedia Commons, en dominio público o con licencias libres de sus autores. Toca cualquiera para ver su ficha y licencia.</p></div><div class="group" style="margin-top:10px">${fs.map(f=>`<a class="cell" style="color:inherit;text-decoration:none;min-height:44px" href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(f)}" target="_blank" rel="noopener"><span class="t"><b style="font-size:14px">${esc(f.replace(/_/g," "))}</b></span>${CHEV}</a>`).join("")}</div><div class="prose"><h4>Fotografías</h4><p>Fotos de Wikimedia Commons con licencias libres. Autor y licencia de cada una:</p></div><div class="group" style="margin-top:10px">${Object.values(IMG.PH).map(p=>`<a class="cell" style="color:inherit;text-decoration:none;min-height:44px" href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(p.t.replace(/ /g,"_"))}" target="_blank" rel="noopener"><span class="t"><b style="font-size:14px">${esc(p.a)}</b><small>${esc(p.l)} · ${esc(p.t)}</small></span>${CHEV}</a>`).join("")}</div><div class="prose"><h4>Ilustraciones</h4><p>Fluent Emoji de Microsoft, licencia MIT.</p><h4>Normativa</h4><p>Reglamento General de Circulación (con la reforma del Real Decreto 518/2026), Ley de Tráfico y Seguridad Vial, Real Decreto 920/2017 (ITV) y notas oficiales de la DGT, a 26/11/2026.</p></div>`)}

// ---- juego ----
let sess=null,exam=null,timerId=null;
const play=$("#play"),sh=$("#sheet");
const CHECK=`<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="14" fill="var(--green)"/><path d="M8 14.5l4 4 8-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CROSS=`<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="14" fill="var(--red)"/><path d="M9.5 9.5l9 9M18.5 9.5l-9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
function openPlay(){play.hidden=false;document.body.style.overflow="hidden"}
function closePlay(){clearInterval(timerId);document.onkeydown=null;play.hidden=true;sh.classList.remove("show");document.body.style.overflow="";sess=null;exam=null}
function mhead(i,n,right,close="Cerrar"){return `<div class="mh"><button class="close" id="px">${close}</button><div class="track"><i style="width:${i/n*100}%"></i></div><span class="cnt" id="pc">${right}</span></div>`}
function startSess(topic){let pool=cards();
if(topic=="__fails")pool=fails();else if(topic)pool=pool.filter(c=>c.t==topic);
const now=Date.now(),d=shuffle(pool.filter(c=>st(c.id).b>0&&st(c.id).d<=now)).sort((a,b)=>st(a.id).b-st(b.id).b),n=shuffle(pool.filter(c=>st(c.id).b==0));
let q=topic=="__fails"?shuffle(pool.slice()).slice(0,10):d.slice(0,10);if(q.length<10)q=q.concat(n.slice(0,10-q.length));
if(q.length<10){const rest=shuffle(pool.filter(c=>!q.includes(c))).sort((a,b)=>st(a.id).d-st(b.id).d);q=q.concat(rest.slice(0,10-q.length))}
if(!q.length)return;sess={q:q.map(c=>({c,miss:false})),i:0,ok:0,tot:q.length,topic};openPlay();showCard()}
function meta(c,extra=""){return `<div class="qmeta"><span>${esc(c.t)}</span>${NEW.has(c.t)?'<span class="new">Nuevo</span>':""}${extra}</div>`}
function showCard(){sh.classList.remove("show");const it=sess.q[sess.i];if(!it)return endSess();const c=it.c;
const extra=it.miss?'<span class="again">· Otra vez</span>':"";
if(c.flash){play.innerHTML=mhead(sess.i,sess.q.length,`${sess.i+1} de ${sess.q.length}`)+`<div class="qwrap">${meta(c,extra)}<p class="qtext">${esc(c.q)}</p><p class="gf" style="margin:0 4px">Piensa la respuesta antes de verla.</p><div style="margin-top:16px"><button class="btn" id="rev">Ver respuesta</button></div></div>`;
$("#px").onclick=()=>go(cur);$("#rev").onclick=()=>{sheet(`<div class="res-h" style="color:var(--blue)">${esc(c.ans)}</div>${c.w?`<p>${esc(c.w)}</p>`:""}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button class="btn gray" id="no">No la sabía</button><button class="btn" id="si">La sabía</button></div>`);$("#si").onclick=()=>grade(true);$("#no").onclick=()=>grade(false)};return}
const ord=shuffle([0,1,2]);
play.innerHTML=mhead(sess.i,sess.q.length,`${sess.i+1} de ${sess.q.length}`)+`<div class="qwrap">${meta(c,extra)}${media(c)}<p class="qtext">${esc(c.q)}</p><div class="opts" id="opts">${ord.map((o,k)=>`<button class="opt" data-o="${o}"><span class="rad">${"ABC"[k]}</span><span>${esc(c.o[o])}</span></button>`).join("")}</div></div>`;
play.scrollTop=0;$("#px").onclick=()=>go(cur);
$("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.dataset.o)};
document.onkeydown=e=>{const k="abc".indexOf(e.key.toLowerCase());if(k>=0&&!$("#opts .opt:disabled"))answer(+$("#opts").children[k].dataset.o)}}
function sheet(html){$("#sheetc").innerHTML=`<div class="grab"></div>${html}`;sh.classList.add("show")}
function answer(o){const it=sess.q[sess.i],c=it.c,right=o==c.a;if(!it.miss)track(c.t,right);
$("#opts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v==c.a){b.classList.add("good");b.querySelector(".rad").textContent="✓"}else if(v==o){b.classList.add("bad");b.querySelector(".rad").textContent="✕"}});
if(!right)vib([30,40,30]);
sheet(`<div class="res-h" style="color:${right?"var(--green)":"var(--red)"}">${right?CHECK:CROSS}${right?"Correcto":"Incorrecto"}</div>${right?"":`<p class="corr">Respuesta correcta: <b style="color:var(--label)">${esc(c.o[c.a])}</b></p>`}<p>${esc(c.w)}</p>${c.h?`<div class="tip"><img src="img/e/light-bulb.webp" alt="">${esc(c.h)}</div>`:""}<button class="btn" id="nx">Continuar</button>`);
$("#nx").onclick=()=>grade(right);setTimeout(()=>{try{$("#nx").focus({preventScroll:true})}catch(e){}},60);document.onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();grade(right)}}}
function grade(right){document.onkeydown=null;const it=sess.q[sess.i],s=st(it.c.id);
if(!it.miss&&!it.c.flash)S.dn++;
if(right){if(!it.miss){s.b=Math.min(5,s.b+1);sess.ok++}else s.b=Math.max(1,s.b);if(!it.miss)s.f=false;s.d=Date.now()+IV[s.b]*DAY}
else{s.b=1;s.f=true;s.d=Date.now();if(!it.miss)sess.q.splice(Math.min(sess.i+4,sess.q.length),0,{c:it.c,miss:true})}
S.c[it.c.id]=s;save();sess.i++;showCard()}
function endSess(){bumpStreak();save();sh.classList.remove("show");const m=mastered(),n=BK.length,t=sess.topic;
play.innerHTML=mhead(1,1,"","Listo")+`<div class="qwrap" style="padding-bottom:40px"><div class="result"><div class="ring">${ringSVG(prog(BK),S.dn/GOAL,160)}</div><h2>${sess.ok} de ${sess.tot} a la primera</h2><p>${S.dn>=GOAL?"Objetivo de hoy cumplido.":`Te faltan ${GOAL-S.dn} para el objetivo de hoy.`} Racha de ${S.streak} ${S.streak==1?"día":"días"}.</p></div>
<div class="group" style="margin:18px 0 0"><div class="cell"><span class="t"><b>Progreso total</b></span><span class="v">${Math.round(prog(BK)*100)} %</span></div><div class="cell"><span class="t"><b>Dominadas</b></span><span class="v">${m} de ${n}</span></div><div class="cell"><span class="t"><b>En progreso</b></span><span class="v">${learning()}</span></div><div class="cell"><span class="t"><b>Pendientes para hoy</b></span><span class="v">${due()}</span></div><div class="cell"><span class="t"><b>Fallos por corregir</b></span><span class="v">${fails().length}</span></div></div>
<div style="display:grid;gap:10px;margin-top:18px"><button class="btn" id="again">Otras 10 preguntas</button><button class="btn gray" id="home">Volver</button></div></div>`;
$("#px").onclick=()=>go(cur);$("#again").onclick=()=>startSess(t);$("#home").onclick=()=>go(cur)}
function startExam(){const q=shuffle(BK.map((x,i)=>i)).slice(0,30);exam={q,ord:q.map(()=>shuffle([0,1,2])),i:0,ans:[],end:Date.now()+30*60e3,done:false};openPlay();timerId=setInterval(tick,1000);showQ()}
function tick(){if(!exam||exam.done)return;const t=Math.max(0,exam.end-Date.now()),el=$("#pc");if(el){el.textContent=`${Math.floor(t/60e3)}:${String(Math.floor(t/1e3)%60).padStart(2,"0")}`;el.classList.toggle("low",t<5*60e3)}if(!t)finishExam()}
function showQ(){if(exam.i>=30)return finishExam();const c=BK[exam.q[exam.i]];
play.innerHTML=mhead(exam.i,30,"","Salir")+`<div class="qwrap"><div class="qmeta"><span>Pregunta ${exam.i+1} de 30</span></div>${media(c)}<p class="qtext">${esc(c.q)}</p><div class="opts" id="opts">${exam.ord[exam.i].map((o,k)=>`<button class="opt" data-o="${o}"><span class="rad">${"ABC"[k]}</span><span>${esc(c.o[o])}</span></button>`).join("")}</div></div>`;
play.scrollTop=0;tick();$("#px").onclick=()=>go("exam");
const pick=(o,b)=>{if(exam.lock)return;exam.lock=true;if(b)b.classList.add("sel");setTimeout(()=>{exam.lock=false;exam.ans.push(o);exam.i++;showQ()},200)};
$("#opts").onclick=e=>{const b=e.target.closest(".opt");if(b)pick(+b.dataset.o,b)};
document.onkeydown=e=>{const k="abc".indexOf(e.key.toLowerCase());if(k>=0)pick(exam.ord[exam.i][k],$("#opts").children[k])}}
function finishExam(){if(exam.done)return;exam.done=true;clearInterval(timerId);document.onkeydown=null;const wrong=[];
exam.q.forEach((qi,k)=>{const c=BK[qi],ok=exam.ans[k]==c.a;if(k<exam.ans.length)track(c.t,ok);if(!ok){wrong.push({c,a:exam.ans[k]});S.c[c.id]={b:1,d:Date.now(),f:true}}else if(k<exam.ans.length){const s=st(c.id);if(s.b<1||s.f)S.c[c.id]={b:Math.max(1,s.b),d:Date.now()+IV[Math.max(1,s.b)]*DAY,f:false}}});
S.ex.push({d:Date.now(),f:wrong.length});S.ex=S.ex.slice(-30);bumpStreak();save();const ok=wrong.length<=3;
play.innerHTML=mhead(1,1,"","Listo")+`<div style="max-width:620px;margin:0 auto;padding-bottom:calc(40px + var(--safe-b))"><div class="result"><div class="ring">${ringSVG((30-wrong.length)/30,null,160)}</div><h2 style="color:${ok?"var(--green)":"var(--red)"}">${ok?"Apto":"No apto"}</h2><p>${30-wrong.length} de 30 correctas · ${wrong.length} ${wrong.length==1?"fallo":"fallos"} (máximo 3)</p></div>
<div style="display:grid;gap:10px;margin:18px 16px 0">${wrong.length?`<button class="btn" id="fx">Corregir estos fallos</button>`:""}<button class="btn gray" id="hm">Volver</button></div>
${wrong.length?`<h2 class="gh">Revisión</h2>`:""}${wrong.map(w=>{const c=w.c;return`<div class="rq">${meta(c)}${media(c)}<h5>${esc(c.q)}</h5>${w.a!=null?`<p class="w">Tu respuesta: ${esc(c.o[w.a])}</p>`:'<p class="w">Sin responder</p>'}<p class="r">Correcta: ${esc(c.o[c.a])}</p><p class="x">${esc(c.w)}</p></div>`}).join("")}</div>`;
play.scrollTop=0;$("#px").onclick=()=>go("exam");$("#hm").onclick=()=>go("exam");const f=$("#fx");if(f)f.onclick=()=>startSess("__fails")}

try{if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});let rl=0;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!rl){rl=1;location.reload()}})}catch(e){}
window.APPV="v15";go("home");

}
</script>
